name: release artifacts

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.12"
      - name: Match tag to package version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          from onecli import __version__

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}" or __version__ != version:
              raise SystemExit(f"tag {tag!r}, package {version!r}, code {__version__!r} disagree")
          PY
      - run: python -m pip install -r scripts/release-build-requirements.txt
      - name: Build source distribution and wheel
        run: python scripts/build-release.py
      - name: Verify recorded rights and artifact license material
        run: python scripts/check-release-rights.py --commit "$GITHUB_SHA" dist/*
      - name: Smoke installed wheel outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/release-venv"
          "$RUNNER_TEMP/release-venv/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/release-venv/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke-wheel.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: one-cli-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # The tag publisher runs on the dedicated release runner.
  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on:
      group: one-release
      labels: [self-hosted, one-release]
    environment:
      name: pypi
      url: https://pypi.org/project/one-core-cli/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: one-cli-${{ github.ref_name }}
          path: dist
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.12"
      - run: python -m pip install "twine==7.0.0"
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - name: Mint a short-lived PyPI token from the GitHub OIDC token and upload
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import urllib.request
          from pathlib import Path

          request = urllib.request.Request(
              os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=pypi",
              headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          with urllib.request.urlopen(request, timeout=30) as response:
              oidc = json.load(response)["value"]
          mint = urllib.request.Request(
              "https://pypi.org/_/oidc/mint-token", method="POST",
              data=json.dumps({"token": oidc}).encode(),
              headers={"Content-Type": "application/json"})
          with urllib.request.urlopen(mint, timeout=30) as response:
              token = json.load(response)["token"]
          print(f"::add-mask::{token}", flush=True)
          # The token stays in this process and its twine child; it is never
          # written to a step output, file or log.
          env = {**os.environ, "TWINE_USERNAME": "__token__", "TWINE_PASSWORD": token,
                 "TWINE_NON_INTERACTIVE": "1"}
          subprocess.run([sys.executable, "-m", "twine", "upload",
                          "--repository-url", "https://upload.pypi.org/legacy/",
                          *sorted(str(path) for path in Path("dist").iterdir())],
                         env=env, check=True)
          PY
